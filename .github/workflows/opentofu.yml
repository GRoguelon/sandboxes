name: opentofu

on:
  workflow_run:
    workflows: [mise]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}

permissions: {}

env:
  BASE: ghcr.io/groguelon/sandboxes-mise:claude-code-minimal
  IMAGE: ghcr.io/groguelon/sandboxes-opentofu

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      tags: ${{ steps.check.outputs.tags }}
      build-args: ${{ steps.check.outputs.build-args }}
      annotations: ${{ steps.check.outputs.annotations }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: check
        shell: bash
        env:
          FORCE: ${{ inputs.force || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/lib.sh
          current="${IMAGE}:claude-code-minimal"

          opentofu_version=$(latest_opentofu)
          base_digest=$(index_digest "$BASE")
          mise_version=$(index_annotation "$BASE" "${ANNOTATION_NS}.mise.version")
          : "${mise_version:?${BASE} has no mise version annotation, run the mise workflow first}"

          decide "$current" "$FORCE" \
            "opentofu|$(index_annotation "$current" "${ANNOTATION_NS}.opentofu.version")|${opentofu_version}" \
            "base digest|$(index_annotation "$current" org.opencontainers.image.base.digest)|${base_digest}"

          set_output tags "claude-code-minimal
          ${opentofu_version}-claude-code-minimal
          ${opentofu_version}-mise-${mise_version}-claude-code-minimal"
          set_output build-args "MISE_IMAGE=${BASE%:*}@${base_digest}
          OPENTOFU_VERSION=${opentofu_version}"
          set_output annotations "org.opencontainers.image.base.name=${BASE}
          org.opencontainers.image.base.digest=${base_digest}
          ${ANNOTATION_NS}.mise.version=${mise_version}
          ${ANNOTATION_NS}.opentofu.version=${opentofu_version}"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/groguelon/sandboxes-opentofu
      context: images/opentofu
      tags: ${{ needs.check.outputs.tags }}
      build-args: ${{ needs.check.outputs.build-args }}
      annotations: ${{ needs.check.outputs.annotations }}
