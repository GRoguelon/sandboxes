name: build-image

# Builds an image natively on amd64 and arm64 runners, pushes each platform by
# digest, then assembles them into a single multi-platform index under every tag.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. ghcr.io/groguelon/sandboxes-mise
        type: string
        required: true
      context:
        description: Build context directory
        type: string
        required: true
      tags:
        description: Newline-separated tags
        type: string
        required: true
      build-args:
        description: Newline-separated KEY=VALUE build arguments
        type: string
        default: ""
      annotations:
        description: Newline-separated KEY=VALUE annotations set on the index
        type: string
        default: ""

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - name: Create multi-platform index
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          ANNOTATIONS: ${{ inputs.annotations }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          args=(--annotation "index:org.opencontainers.image.source=${SOURCE}")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(--tag "${IMAGE}:${tag}")
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            [[ -n "$annotation" ]] && args+=(--annotation "index:${annotation}")
          done <<< "$ANNOTATIONS"
          docker buildx imagetools create "${args[@]}" $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
        run: docker buildx imagetools inspect "${IMAGE}:$(head -n 1 <<< "$TAGS")"
